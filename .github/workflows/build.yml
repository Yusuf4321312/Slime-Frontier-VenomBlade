name: Build Minecraft Mod JAR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build mod
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.10.2'
          arguments: build --no-daemon
      - name: Upload JAR as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Slime-Frontier-VenomBlade-JAR
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Publish JAR as GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          JAR_PATH="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)"
          test -n "$JAR_PATH"
          gh release create "build-$RUN_NUMBER" "$JAR_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Slime Frontier VenomBlade build $RUN_NUMBER" \
            --notes "Automated Minecraft 1.21.1 NeoForge build."
